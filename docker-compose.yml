version: '3.9'

services:
  # ── Laravel Backend ─────────────────────────────────────
  backend:
    image: php:8.3-cli
    container_name: eduko_backend
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    command: >
      sh -c "
        apt-get update -qq &&
        apt-get install -y -qq libzip-dev curl &&
        docker-php-ext-install zip pdo &&
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
        composer install --no-interaction --quiet &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    depends_on:
      - redis
    networks:
      - eduko_net

  # ── React Frontend ───────────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: eduko_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_AI_URL=http://localhost:4000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - eduko_net

  # ── FastAPI AI Microservice ──────────────────────────────
  ai:
    image: python:3.11-slim
    container_name: eduko_ai
    working_dir: /app
    volumes:
      - ./ai-service:/app
    ports:
      - "4000:4000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_PERSIST_DIR=/app/chroma_db
    command: >
      sh -c "
        pip install --quiet -r requirements.txt &&
        uvicorn main:app --host 0.0.0.0 --port 4000 --reload
      "
    networks:
      - eduko_net

  # ── Redis (Queue + Cache) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eduko_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eduko_net

volumes:
  redis_data:

networks:
  eduko_net:
    driver: bridge
